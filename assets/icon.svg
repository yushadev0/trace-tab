<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Trace Tab — master icon (V3 "Kıvılcım"). Edit here, then run: npm run icons -->
  <rect width="128" height="128" rx="28" fill="#6366F1"/>

  <!-- Radial burst: 11 rays + center dot, one wedge left open (upper-right) for
       intentional asymmetry. Authored in a 100x100 box, scaled onto the 128 plate. -->
  <g transform="translate(4 4) scale(1.2)">
    <!-- drop shadow: whole mark duplicated +1,+1 in darker indigo -->
    <g transform="translate(1 1)">
      <g stroke="#4338CA" stroke-width="3.6" stroke-linecap="round">
        <line x1="50" y1="40" x2="50" y2="16"/>
        <line x1="55" y1="41.34" x2="63" y2="27.48"/>
        <line x1="60" y1="50" x2="84" y2="50"/>
        <line x1="58.66" y1="55" x2="72.52" y2="63"/>
        <line x1="55" y1="58.66" x2="67" y2="79.44"/>
        <line x1="50" y1="60" x2="50" y2="76"/>
        <line x1="45" y1="58.66" x2="33" y2="79.44"/>
        <line x1="41.34" y1="55" x2="27.48" y2="63"/>
        <line x1="40" y1="50" x2="16" y2="50"/>
        <line x1="41.34" y1="45" x2="27.48" y2="37"/>
        <line x1="45" y1="41.34" x2="33" y2="20.56"/>
      </g>
      <circle cx="50" cy="50" r="3.2" fill="#4338CA"/>
    </g>

    <!-- main mark, white -->
    <g stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round">
      <line x1="50" y1="40" x2="50" y2="16"/>
      <line x1="55" y1="41.34" x2="63" y2="27.48"/>
      <line x1="60" y1="50" x2="84" y2="50"/>
      <line x1="58.66" y1="55" x2="72.52" y2="63"/>
      <line x1="55" y1="58.66" x2="67" y2="79.44"/>
      <line x1="50" y1="60" x2="50" y2="76"/>
      <line x1="45" y1="58.66" x2="33" y2="79.44"/>
      <line x1="41.34" y1="55" x2="27.48" y2="63"/>
      <line x1="40" y1="50" x2="16" y2="50"/>
      <line x1="41.34" y1="45" x2="27.48" y2="37"/>
      <line x1="45" y1="41.34" x2="33" y2="20.56"/>
    </g>
    <circle cx="50" cy="50" r="3.2" fill="#FFFFFF"/>
  </g>
</svg>
